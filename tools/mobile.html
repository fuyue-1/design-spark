<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>手机尺寸预览</title>
<style>
  html,body{margin:0;background:#1b1d24}
  iframe{display:block;width:390px;height:860px;border:0;background:#fff}
</style></head>
<body>
<iframe id="f" src="../index.html#/home"></iframe>
<script>
  var page = new URLSearchParams(location.search).get('p') || 'home';
  document.getElementById('f').src = '../index.html#/' + page;
</script>
</body></html>
